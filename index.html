<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задачи — Минималистичный Трекер</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Custom smooth checkmark styling */
        .custom-checkbox {
            position: relative;
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 0.375rem;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .custom-checkbox-icon {
            stroke-dasharray: 24;
            stroke-dashoffset: 24;
            transition: stroke-dashoffset 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        input[type="checkbox"]:checked + .custom-checkbox .custom-checkbox-icon {
            stroke-dashoffset: 0;
        }

        /* Strike-through text animation */
        .task-text {
            position: relative;
            transition: color 0.3s ease, opacity 0.3s ease;
        }

        .task-text::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 0%;
            height: 1.5px;
            background-color: currentColor;
            transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .task-completed .task-text::after {
            width: 100%;
        }

        /* Entry & Exit animations for list items */
        .task-item {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Ultra thin scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.4);
        }
    </style>
</head>
<body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen font-sans antialiased transition-colors duration-300 selection:bg-zinc-200 dark:selection:bg-zinc-800">

    <div class="max-w-2xl mx-auto px-6 py-12 md:py-20 flex flex-col min-h-screen">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-3">
                <h1 class="text-xl font-medium tracking-tight text-zinc-900 dark:text-zinc-100">Задачи</h1>
                <span id="activeCount" class="text-xs px-2 py-0.5 rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-500 dark:text-zinc-400 font-medium transition-all">0</span>
                <span id="syncBadge" class="hidden text-[10px] uppercase font-semibold tracking-wider px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-500 border border-emerald-500/20">
                    Облако
                </span>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- User Auth Profile / Login Button -->
                <div id="authContainer" class="flex items-center gap-2">
                    <button id="loginBtn" class="flex items-center gap-2 text-xs font-medium px-3 py-1.5 rounded-lg border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-100 dark:hover:bg-zinc-900 transition-all text-zinc-700 dark:text-zinc-300">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        <span>Войти</span>
                    </button>

                    <div id="userProfile" class="hidden flex items-center gap-2">
                        <img id="userAvatar" class="w-7 h-7 rounded-full border border-zinc-200 dark:border-zinc-800 object-cover" src="" alt="Avatar">
                        <button id="logoutBtn" class="p-1.5 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 transition-colors rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-900" title="Выйти из аккаунта">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Clear completed tasks button -->
                <button id="clearCompletedBtn" class="hidden p-2 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 transition-colors rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-900" title="Очистить завершенные">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
                <!-- Theme Toggle Button -->
                <button id="themeToggle" class="p-2 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 transition-colors rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-900" title="Переключить тему">
                    <svg id="themeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <!-- Path dynamically swapped via JS -->
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Input Container -->
        <div class="relative mb-10 group">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Что нужно сделать?" 
                autocomplete="off"
                class="w-full bg-transparent text-lg md:text-xl font-normal placeholder-zinc-400 dark:placeholder-zinc-600 text-zinc-900 dark:text-zinc-100 border-b border-zinc-200 dark:border-zinc-800 focus:border-zinc-900 dark:focus:border-zinc-100 py-3 px-1 outline-none transition-colors duration-200"
            >
            <div class="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-zinc-400 opacity-0 group-focus-within:opacity-100 transition-opacity pointer-events-none hidden sm:block">
                нажмите <kbd class="px-1.5 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 font-mono text-[10px]">Enter</kbd>
            </div>
        </div>

        <!-- Task Lists Container -->
        <main class="flex-grow space-y-12">
            
            <!-- Section: Active Tasks -->
            <section id="activeSection">
                <div id="activeTaskList" class="space-y-1">
                    <!-- Dynamic Active Tasks inserted here -->
                </div>
                <!-- Empty state for active list -->
                <div id="emptyActive" class="hidden py-12 text-center">
                    <p class="text-sm text-zinc-400 dark:text-zinc-600">Все задачи выполнены. Время отдохнуть ✨</p>
                </div>
            </section>

            <!-- Section: Completed Tasks -->
            <section id="completedSection" class="transition-opacity duration-300">
                <div class="flex items-center gap-2 mb-4">
                    <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-400 dark:text-zinc-600">Завершенные</h2>
                    <span id="completedCount" class="text-xs text-zinc-400 dark:text-zinc-600 font-normal">0</span>
                </div>
                <div id="completedTaskList" class="space-y-1">
                    <!-- Dynamic Completed Tasks inserted here -->
                </div>
            </section>

        </main>

        <!-- Footer -->
        <footer class="mt-16 text-center text-xs text-zinc-400 dark:text-zinc-600">
            <p>Двойной клик по тексту для редактирования</p>
        </footer>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration (Injecting environment variables or demo fallback)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'minimal-task-tracker';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDemoConfigFallbackApiKey12345678",
            authDomain: "demo-app.firebaseapp.com",
            projectId: "demo-app",
            storageBucket: "demo-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:123456789"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        // --- App State ---
        let currentUser = null;
        let unsubscribeSnapshot = null;
        let tasks = JSON.parse(localStorage.getItem('minimal_tasks')) || [
            { id: 1, text: 'Добро пожаловать в минималистичный трекер', completed: false },
            { id: 2, text: 'Войдите через Google, чтобы синхронизировать задачи', completed: false },
            { id: 3, text: 'Нажмите на квадратик слева, чтобы завершить задачу', completed: true }
        ];

        // --- DOM Elements ---
        const taskInput = document.getElementById('taskInput');
        const activeTaskList = document.getElementById('activeTaskList');
        const completedTaskList = document.getElementById('completedTaskList');
        const emptyActive = document.getElementById('emptyActive');
        const activeCount = document.getElementById('activeCount');
        const completedCount = document.getElementById('completedCount');
        const completedSection = document.getElementById('completedSection');
        const clearCompletedBtn = document.getElementById('clearCompletedBtn');
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userProfile = document.getElementById('userProfile');
        const userAvatar = document.getElementById('userAvatar');
        const syncBadge = document.getElementById('syncBadge');

        // --- Save Tasks (Firestore or LocalStorage) ---
        async function saveTasks() {
            if (currentUser) {
                try {
                    // RULE 1: Standardized user path /artifacts/{appId}/users/{userId}/data/tasks
                    const userDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'data', 'user_tasks');
                    await setDoc(userDocRef, { tasks: tasks }, { merge: true });
                } catch (error) {
                    console.error("Ошибка сохранения в Firestore:", error);
                }
            } else {
                localStorage.setItem('minimal_tasks', JSON.stringify(tasks));
            }
        }

        // --- Firestore Realtime Listener ---
        function subscribeToFirestore(userId) {
            if (unsubscribeSnapshot) unsubscribeSnapshot();

            const userDocRef = doc(db, 'artifacts', appId, 'users', userId, 'data', 'user_tasks');
            unsubscribeSnapshot = onSnapshot(userDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data && Array.isArray(data.tasks)) {
                        tasks = data.tasks;
                        render();
                    }
                } else {
                    // Initial sync: migrate local tasks to cloud
                    saveTasks();
                }
            }, (error) => {
                console.error("Ошибка синхронизации Firestore:", error);
            });
        }

        // --- Render UI ---
        function render() {
            activeTaskList.innerHTML = '';
            completedTaskList.innerHTML = '';

            const activeTasks = tasks.filter(t => !t.completed);
            const completedTasks = tasks.filter(t => t.completed);

            // Update Counts
            activeCount.textContent = activeTasks.length;
            completedCount.textContent = completedTasks.length;

            // Toggle empty active state
            if (activeTasks.length === 0) {
                emptyActive.classList.remove('hidden');
            } else {
                emptyActive.classList.add('hidden');
            }

            // Toggle completed section visibility
            if (completedTasks.length === 0) {
                completedSection.classList.add('hidden');
                clearCompletedBtn.classList.add('hidden');
            } else {
                completedSection.classList.remove('hidden');
                clearCompletedBtn.classList.remove('hidden');
            }

            // Render Active List
            activeTasks.forEach(task => {
                activeTaskList.appendChild(createTaskNode(task));
            });

            // Render Completed List
            completedTasks.forEach(task => {
                completedTaskList.appendChild(createTaskNode(task));
            });
        }

        // --- Create Task Node ---
        function createTaskNode(task) {
            const wrapper = document.createElement('div');
            wrapper.className = `task-item group flex items-start gap-3 py-2.5 px-2 rounded-lg hover:bg-zinc-50 dark:hover:bg-zinc-900/50 transition-colors ${task.completed ? 'task-completed opacity-50' : ''}`;
            wrapper.dataset.id = task.id;

            // Checkbox markup
            const checkboxContainer = document.createElement('label');
            checkboxContainer.className = 'relative flex items-center justify-center cursor-pointer mt-0.5 select-none';

            const realCheckbox = document.createElement('input');
            realCheckbox.type = 'checkbox';
            realCheckbox.checked = task.completed;
            realCheckbox.className = 'sr-only';
            realCheckbox.addEventListener('change', () => toggleTask(task.id));

            const customBox = document.createElement('div');
            customBox.className = 'custom-checkbox border border-zinc-300 dark:border-zinc-700 bg-transparent group-hover:border-zinc-400 dark:group-hover:border-zinc-500 flex items-center justify-center';
            if (task.completed) {
                customBox.classList.add('bg-zinc-900', 'dark:bg-zinc-100', 'border-zinc-900', 'dark:border-zinc-100');
            }

            customBox.innerHTML = `
                <svg class="w-3 h-3 text-white dark:text-zinc-900 custom-checkbox-icon" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                </svg>
            `;

            checkboxContainer.appendChild(realCheckbox);
            checkboxContainer.appendChild(customBox);

            // Task Content
            const textContainer = document.createElement('div');
            textContainer.className = 'flex-grow min-w-0 pr-2';

            const textSpan = document.createElement('span');
            textSpan.className = `task-text inline-block break-words text-base font-normal leading-relaxed text-zinc-800 dark:text-zinc-200 cursor-pointer select-none`;
            textSpan.textContent = task.text;

            // Double click to edit
            textSpan.addEventListener('dblclick', () => {
                enableEditing(task.id, textContainer, task.text);
            });

            textContainer.appendChild(textSpan);

            // Delete button (visible on hover)
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'opacity-0 group-hover:opacity-100 text-zinc-300 hover:text-zinc-600 dark:text-zinc-700 dark:hover:text-zinc-300 transition-all p-1 rounded focus:opacity-100';
            deleteBtn.title = 'Удалить';
            deleteBtn.innerHTML = `
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            `;
            deleteBtn.addEventListener('click', () => deleteTask(task.id));

            wrapper.appendChild(checkboxContainer);
            wrapper.appendChild(textContainer);
            wrapper.appendChild(deleteBtn);

            return wrapper;
        }

        // --- Task CRUD Operations ---
        function addTask(text) {
            const trimmed = text.trim();
            if (!trimmed) return;

            const newTask = {
                id: Date.now(),
                text: trimmed,
                completed: false
            };

            tasks.unshift(newTask);
            saveTasks();
            render();
            taskInput.value = '';
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            saveTasks();
            render();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            render();
        }

        clearCompletedBtn.addEventListener('click', () => {
            tasks = tasks.filter(t => !t.completed);
            saveTasks();
            render();
        });

        // --- Inline Edit Mode ---
        function enableEditing(id, container, currentText) {
            container.innerHTML = '';
            const input = document.createElement('input');
            input.type = 'text';
            input.value = currentText;
            input.className = 'w-full bg-transparent text-base font-normal text-zinc-900 dark:text-zinc-100 outline-none border-b border-zinc-400 dark:border-zinc-500 py-0.5 px-0';
            
            const finishEdit = () => {
                const newText = input.value.trim();
                if (newText) {
                    tasks = tasks.map(t => t.id === id ? { ...t, text: newText } : t);
                    saveTasks();
                } else {
                    deleteTask(id);
                }
                render();
            };

            input.addEventListener('blur', finishEdit);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') finishEdit();
                else if (e.key === 'Escape') render();
            });

            container.appendChild(input);
            input.focus();
            input.select();
        }

        taskInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addTask(taskInput.value);
        });

        // --- Firebase Auth Handlers ---
        loginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, googleProvider);
            } catch (error) {
                console.error("Ошибка авторизации Google:", error);
            }
        });

        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Ошибка выхода:", error);
            }
        });

        // Auth State Observer
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                // Logged in UI
                loginBtn.classList.add('hidden');
                userProfile.classList.remove('hidden');
                syncBadge.classList.remove('hidden');
                userAvatar.src = user.photoURL || `https://placehold.co/100x100/18181b/ffffff?text=${encodeURIComponent(user.displayName ? user.displayName[0] : 'U')}`;
                
                // Subscribe to Cloud Firestore
                subscribeToFirestore(user.uid);
            } else {
                // Logged out UI
                if (unsubscribeSnapshot) unsubscribeSnapshot();
                loginBtn.classList.remove('hidden');
                userProfile.classList.add('hidden');
                syncBadge.classList.add('hidden');
                
                // Load local tasks
                tasks = JSON.parse(localStorage.getItem('minimal_tasks')) || [];
                render();
            }
        });

        // --- Theme Switcher ---
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
                setThemeIcon(true);
            } else {
                document.documentElement.classList.remove('dark');
                setThemeIcon(false);
            }
        }

        function setThemeIcon(isDark) {
            if (isDark) {
                themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />`;
            } else {
                themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />`;
            }
        }

        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            setThemeIcon(isDark);
        });

        // Initial setup
        initTheme();
        render();
    </script>
</body>
</html>
